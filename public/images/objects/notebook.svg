<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="nbClay" x1="40" y1="32" x2="158" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7F5F0"/>
      <stop offset="60%" stop-color="#EBE8E0"/>
      <stop offset="100%" stop-color="#D7D2C8"/>
    </linearGradient>
    <filter id="nbDrop" x="20" y="14" width="166" height="178" filterUnits="userSpaceOnUse">
      <feDropShadow dx="4" dy="14" stdDeviation="11" flood-color="#1A1815" flood-opacity="0.17"/>
    </filter>
  </defs>
  <g filter="url(#nbDrop)">
    <!-- Spiral binding rings at top -->
    <g stroke="#CFCAC0" stroke-width="6" stroke-linecap="round">
      <line x1="66" y1="24" x2="66" y2="44"/>
      <line x1="88" y1="24" x2="88" y2="44"/>
      <line x1="110" y1="24" x2="110" y2="44"/>
      <line x1="132" y1="24" x2="132" y2="44"/>
    </g>
    <!-- Back pages depth -->
    <rect x="46" y="38" width="112" height="140" rx="16" fill="#C7C2B8"/>
    <!-- Front clay notebook cover -->
    <rect x="40" y="32" width="112" height="140" rx="16" fill="url(#nbClay)" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Binding holes -->
    <g fill="#B8B3A8">
      <circle cx="66" cy="44" r="4"/>
      <circle cx="88" cy="44" r="4"/>
      <circle cx="110" cy="44" r="4"/>
      <circle cx="132" cy="44" r="4"/>
    </g>
    <!-- Clean black-line neural network diagram (matching reference!) -->
    <g stroke="#27272A" stroke-width="1.6">
      <line x1="68" y1="86" x2="96" y2="76"/>
      <line x1="68" y1="86" x2="96" y2="104"/>
      <line x1="68" y1="86" x2="96" y2="130"/>
      <line x1="68" y1="116" x2="96" y2="76"/>
      <line x1="68" y1="116" x2="96" y2="104"/>
      <line x1="68" y1="116" x2="96" y2="130"/>
      <line x1="96" y1="76" x2="124" y2="90"/>
      <line x1="96" y1="76" x2="124" y2="118"/>
      <line x1="96" y1="104" x2="124" y2="90"/>
      <line x1="96" y1="104" x2="124" y2="118"/>
      <line x1="96" y1="130" x2="124" y2="90"/>
      <line x1="96" y1="130" x2="124" y2="118"/>
    </g>
    <g fill="#F4F2EC" stroke="#27272A" stroke-width="1.8">
      <circle cx="68" cy="86" r="5"/>
      <circle cx="68" cy="116" r="5"/>
      <circle cx="96" cy="76" r="5"/>
      <circle cx="96" cy="104" r="5"/>
      <circle cx="96" cy="130" r="5"/>
      <circle cx="124" cy="90" r="5"/>
      <circle cx="124" cy="118" r="5"/>
    </g>
  </g>
</svg>
