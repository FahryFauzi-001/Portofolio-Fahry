      <stop offset="0%" stop-color="#FAF9F5"/>
      <stop offset="52%" stop-color="#EAE7DF"/>
      <stop offset="100%" stop-color="#CFCAC0"/>
    </linearGradient>
    <linearGradient id="mugInside" x1="50" y1="52" x2="130" y2="74" gradientUnits="userSpaceOnUse">
