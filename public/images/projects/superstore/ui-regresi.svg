  <text x="44" y="330" fill="#166534" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600">Backend aktif · /health OK</text>

  <!-- Main Content Area -->
  <text x="390" y="92" fill="#111827" font-family="system-ui, sans-serif" font-size="36" font-weight="800">Estimasi Omzet (Sales)</text>
