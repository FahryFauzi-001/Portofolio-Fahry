  <text x="1018" y="451" fill="#374151" font-family="system-ui, sans-serif" font-size="14">Technology: 1</text>

  <rect x="422" y="492" width="186" height="44" rx="10" fill="#FF4B4B"/>
  <text x="515" y="519" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Estimasi Sales</text>

  <!-- Regression Result Panel -->
  <line x1="390" y1="596" x2="1310" y2="596" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="390" y="640" fill="#111827" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Hasil Estimasi · POST /predict/regression</text>

  <rect x="390" y="664" width="920" height="122" rx="14" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="422" y="704" fill="#6B7280" font-family="system-ui, sans-serif" font-size="15">Estimasi Nilai Omzet (Sales)</text>
  <text x="422" y="758" fill="#111827" font-family="ui-monospace, monospace" font-size="42" font-weight="800">$482.50</text>
  <text x="720" y="746" fill="#6B7280" font-family="ui-monospace, monospace" font-size="14">Test Set: R² 0.765 · MAE $158 / order</text>

  <text x="390" y="826" fill="#6B7280" font-family="system-ui, sans-serif" font-size="14">Catatan: Estimasi regresi Random Forest dipengaruhi kuat oleh ongkos kirim (ablation study pada notebook).</text>
