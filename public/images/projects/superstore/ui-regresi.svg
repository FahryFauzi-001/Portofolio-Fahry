  <text x="878" y="355" fill="#111827" font-family="ui-monospace, monospace" font-size="14">42.50</text>

  <text x="422" y="408" fill="#111827" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Komposisi keranjang (jumlah baris produk per kategori)</text>
