<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" fill="none">
  <rect width="1400" height="920" fill="#FFFFFF"/>
  <!-- Streamlit Sidebar -->
  <rect width="310" height="920" fill="#F0F2F6"/>
  <line x1="310" y1="0" x2="310" y2="920" stroke="#E2E5EC" stroke-width="1.5"/>

  <!-- Nav Items -->
  <rect x="20" y="48" width="270" height="44" rx="10" fill="#E3E7F0"/>
  <text x="38" y="76" fill="#1F2937" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Klasifikasi: Risiko Profit</text>
  <text x="38" y="122" fill="#6B7280" font-family="system-ui, sans-serif" font-size="15" font-weight="500">Regresi: Estimasi Sales</text>

  <line x1="24" y1="164" x2="286" y2="164" stroke="#DCE0E8" stroke-width="1.5"/>
  <text x="28" y="206" fill="#1F2937" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Backend API</text>
  <text x="28" y="232" fill="#6B7280" font-family="ui-monospace, monospace" font-size="12">http://localhost:8000</text>
  <rect x="28" y="252" width="190" height="38" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="123" y="276" text-anchor="middle" fill="#1F2937" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600">Cek koneksi backend</text>
  <rect x="28" y="304" width="250" height="42" rx="8" fill="#DCFCE7"/>
  <text x="44" y="330" fill="#166534" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600">Backend aktif · /health OK</text>

  <!-- Main Content Area (centered layout matching st.set_page_config) -->
  <text x="390" y="92" fill="#111827" font-family="system-ui, sans-serif" font-size="36" font-weight="800">Prediksi Risiko Profit</text>
  <text x="390" y="130" fill="#4B5563" font-family="system-ui, sans-serif" font-size="16">Task Klasifikasi. Masukkan detail keranjang untuk memprediksi Untung atau Rugi.</text>

  <!-- Form Card -->
  <rect x="390" y="162" width="920" height="398" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="422" y="208" fill="#111827" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Detail Pesanan</text>

  <!-- Column 1 inputs -->
  <text x="422" y="244" fill="#374151" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600">Mode Pengiriman</text>
  <rect x="422" y="254" width="405" height="40" rx="8" fill="#F3F4F6"/>
  <text x="438" y="279" fill="#111827" font-family="system-ui, sans-serif" font-size="14">Standard Class</text>

  <text x="422" y="320" fill="#374151" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600">Total Kuantitas (unit)</text>
  <rect x="422" y="330" width="405" height="40" rx="8" fill="#F3F4F6"/>
  <text x="438" y="355" fill="#111827" font-family="ui-monospace, monospace" font-size="14">6</text>

  <!-- Column 2 inputs -->
  <text x="862" y="244" fill="#374151" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600">Persentase Diskon (0% – 85%)</text>
  <rect x="862" y="270" width="415" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="862" y="270" width="60" height="6" rx="3" fill="#FF4B4B"/>
  <circle cx="922" cy="273" r="9" fill="#FF4B4B"/>
  <text x="910" y="256" fill="#FF4B4B" font-family="ui-monospace, monospace" font-size="13" font-weight="700">10%</text>

  <text x="862" y="320" fill="#374151" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600">Ongkos Kirim (USD)</text>
  <rect x="862" y="330" width="415" height="40" rx="8" fill="#F3F4F6"/>
  <text x="878" y="355" fill="#111827" font-family="ui-monospace, monospace" font-size="14">15.00</text>

  <!-- Komposisi keranjang -->
  <text x="422" y="408" fill="#111827" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Komposisi keranjang (jumlah baris produk per kategori)</text>
  <rect x="422" y="424" width="265" height="44" rx="8" fill="#F3F4F6"/>
  <text x="438" y="451" fill="#374151" font-family="system-ui, sans-serif" font-size="14">Furniture: 1</text>
  <rect x="712" y="424" width="265" height="44" rx="8" fill="#F3F4F6"/>
  <text x="728" y="451" fill="#374151" font-family="system-ui, sans-serif" font-size="14">Office Supplies: 1</text>
  <rect x="1002" y="424" width="275" height="44" rx="8" fill="#F3F4F6"/>
  <text x="1018" y="451" fill="#374151" font-family="system-ui, sans-serif" font-size="14">Technology: 1</text>

  <!-- Submit button -->
  <rect x="422" y="492" width="186" height="44" rx="10" fill="#FF4B4B"/>
  <text x="515" y="519" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Analisis Risiko</text>

  <!-- Result Panel -->
  <line x1="390" y1="596" x2="1310" y2="596" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="390" y="640" fill="#111827" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Hasil Analisis · POST /predict/classification</text>

  <rect x="390" y="664" width="445" height="106" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="416" y="698" fill="#6B7280" font-family="system-ui, sans-serif" font-size="14">Probabilitas Untung</text>
  <text x="416" y="746" fill="#111827" font-family="ui-monospace, monospace" font-size="36" font-weight="800">86.40%</text>

  <rect x="865" y="664" width="445" height="106" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="891" y="698" fill="#6B7280" font-family="system-ui, sans-serif" font-size="14">Prediksi Model (ambang 50%)</text>
  <text x="891" y="746" fill="#166534" font-family="system-ui, sans-serif" font-size="34" font-weight="800">Untung</text>

  <!-- 3-tier banner -->
  <rect x="390" y="794" width="920" height="62" rx="12" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="418" y="831" fill="#14532D" font-family="system-ui, sans-serif" font-size="15.5" font-weight="700">Rekomendasi: Safe to Process — Transaksi diprediksi menguntungkan (Safe ≥ 70% · Review 50–69.9% · High Risk &lt; 50%)</text>
</svg>
